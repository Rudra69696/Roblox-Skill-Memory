<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Memory Pro</title>
<style>
body{font-family:Arial;max-width:900px;margin:auto;padding:20px}
.card{border:1px solid #ccc;border-radius:8px;padding:10px;margin:10px 0}
input,textarea{width:100%;padding:8px;box-sizing:border-box;margin:5px 0}
textarea{height:120px}
button{padding:8px 12px;margin:4px}
</style>
</head>
<body>
<h1>Skill Memory Pro</h1>

<button onclick="addSkill()">+ Add Skill</button>
<button onclick="exportData()">Export</button>
<button onclick="document.getElementById('imp').click()">Import</button>
<input id="imp" type="file" accept=".json" style="display:none">

<div id="skills"></div>

<script>
function save(){
  const data=[];
  document.querySelectorAll('.card').forEach(c=>{
    data.push({
      name:c.querySelector('input').value,
      text:c.querySelector('textarea').value
    });
  });
  localStorage.setItem('skills',JSON.stringify(data));
}

function addSkill(name="",text=""){
  const d=document.createElement('div');
  d.className='card';
  d.innerHTML=`
    <input placeholder="Skill Name" value="${name}">
    <textarea placeholder="Process">${text}</textarea>
    <button onclick="this.parentElement.remove();save()">Delete</button>
  `;
  d.querySelectorAll('input,textarea').forEach(e=>{
    e.addEventListener('input',save);
  });
  document.getElementById('skills').appendChild(d);
  save();
}

function load(){
  JSON.parse(localStorage.getItem('skills')||'[]')
    .forEach(x=>addSkill(x.name,x.text));
}

function exportData(){
  const blob=new Blob([localStorage.getItem('skills')||'[]'],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='skills.json';
  a.click();
}

document.getElementById('imp').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    localStorage.setItem('skills',r.result);
    location.reload();
  };
  r.readAsText(f);
});

load();
</script>
</body>
</html>
